name: Source and frontend checks
on:
  pull_request:
  push:
    branches: ["fix/**"]
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m compileall -q backend/app
      - name: Install database test dependencies
        run: python -m pip install duckdb pandas
      - name: Test migration and query safety
        run: cd backend && python -m unittest discover -s tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build
